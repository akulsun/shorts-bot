# Shorts Bot configuration.
# Relative paths are resolved from the folder containing this file.

logging:
  level: INFO
  file: temp/shortsbot.log

paths:
  downloads: downloads
  temp: temp
  output: output

download:
  max_height: 1080
  # Optional: pull cookies from a browser ("chrome", "firefox", ...) when a
  # video is age-restricted. Leave null for normal videos.
  cookies_from_browser: null

transcription:
  # tiny | base | small | medium | large-v3
  # "small" is the intended default; "base" is used while building and testing.
  model_size: base
  compute_type: int8
  cpu_threads: 6
  # null = auto-detect language
  language: null
  vad_filter: true
  beam_size: 5

selection:
  # Swap point for clip picking: "hybrid" (multimodal audio+heatmap+llm),
  # "heuristic" (legacy rules), or "gemini" (direct LLM semantic selection).
  selector: hybrid
  min_seconds: 20.0
  max_seconds: 60.0
  max_clips: 10
  # Use audio energy / RMS spikes (laughter, shouting, climaxes) from audio.wav
  use_audio_energy: true
  # Use YouTube crowdsourced replay heatmap if available
  use_youtube_heatmap: true
  # LLM settings: Recommended to put GEMINI_API_KEY in .env file (ignored by git).
  # You can also set api_key directly here or via GEMINI_API_KEY environment variable.
  api_key: null
  llm_model: gemini-3.5-flash-lite
  llm_api_key_env: GEMINI_API_KEY
  keywords:
    - mistake
    - secret
    - never
    - always
    - biggest
    - worst
    - best
    - free
    - money
    - how to
    - why
    - what if
    - stop
    - truth
    - nobody
    - everyone
    - finally
    - number one
  weights:
    speech_density: 1.0
    keywords: 0.8
    hook: 1.2
    completeness: 0.8
    filler: 0.5
    silence: 0.5
    audio_energy: 1.2
    heatmap: 1.5

render:
  width: 1080
  height: 1920
  fps: 30
  # blur_pad = vertical video on a blurred copy of itself (keeps the full frame)
  # center   = crop to the middle of the frame (loses the sides)
  crop_mode: blur_pad
  preset: veryfast
  crf: 21
  audio_bitrate: 128k

captions:
  enabled: true
  font: Arial
  font_size: 72
  max_words_per_line: 4
  margin_v: 380
  outline: 4
  bold: true
